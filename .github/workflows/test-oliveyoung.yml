name: Test Olive Young reader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public product page
        run: |
          mkdir -p diagnostic
          cat > /tmp/check_oy.py <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              out = Path('diagnostic')
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(locale='ko-KR', viewport={'width':1440,'height':1000})
                  report = {'goodsNo':'A000000213943', 'benefit_popup_clicked':False}
                  try:
                      response = await page.goto('https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=A000000213943', wait_until='domcontentloaded', timeout=60000)
                      report['http_status'] = response.status if response else None
                      await page.wait_for_timeout(12000)
                      await page.screenshot(path=str(out/'01-page.png'), full_page=True)
                      (out/'01-page.txt').write_text(await page.locator('body').inner_text(), encoding='utf-8')
                      controls = await page.locator('button, a, [role="button"]').evaluate_all('(els) => els.map(e=>({text:e.innerText,title:e.title,aria:e.getAttribute("aria-label")}))')
                      (out/'controls.json').write_text(json.dumps(controls,ensure_ascii=False,indent=2),encoding='utf-8')
                      for text in ['혜택정보','혜택 정보','할인혜택','가격정보','가격 정보']:
                          target = page.get_by_text(text, exact=True)
                          for i in range(await target.count()):
                              if await target.nth(i).is_visible():
                                  try:
                                      await target.nth(i).click(timeout=3000)
                                      report['benefit_popup_clicked'] = True
                                      break
                                  except Exception:
                                      pass
                          if report['benefit_popup_clicked']:
                              break
                      await page.wait_for_timeout(2000)
                      await page.screenshot(path=str(out/'02-after.png'), full_page=True)
                      (out/'02-after.txt').write_text(await page.locator('body').inner_text(),encoding='utf-8')
                  except Exception as e:
                      report['error'] = str(e)
                  finally:
                      (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
                      await browser.close()
          asyncio.run(main())
          PY
          python /tmp/check_oy.py
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oliveyoung-diagnostic
          path: diagnostic/
          retention-days: 3
