name: Update Olive Young Prices

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 👈 關鍵：賦予 workflow 寫入 repository 的權限

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run price scraper script
        run: python scraper.py

      - name: Commit and push updated prices
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add oliveyoung_prices.json
          git commit -m "Auto-update Olive Young prices" || exit 0
          git push origin main || git push origin master
