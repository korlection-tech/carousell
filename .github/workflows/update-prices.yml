name: Update Olive Young Prices

on:
  schedule:
    - cron: '0 0 * * *'  # 每日定時自動執行
  workflow_dispatch:      # 支援手動觸發

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run price scraper script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}  # 👈 呢行好重要：將你頭先加嘅 Secret 傳入 Python
        run: python scraper.py

      - name: Commit and push updated prices
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add oliveyoung_prices.json
          git commit -m "Auto-update Olive Young prices via Apify" || exit 0
          git push origin main || git push origin master
