<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓國 Olive Young 代購價格查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .header-section { text-align: center; margin-bottom: 25px; }
        .company-logo { 
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; 
            border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1a1a1a; margin: 0 0 8px 0; font-size: 28px; font-weight: 700; }
        .subtitle { color: #4a5568; margin: 0 0 6px 0; font-size: 15px; font-weight: 600; }
        .notice-text { color: #e53e3e; font-size: 13px; margin: 0; font-weight: 500; }
        
        .status-message { text-align: center; padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .status-loading { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }

        .search-box {
            background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 30px;
        }
        label { font-weight: 600; display: block; margin-bottom: 10px; color: #2c3e50; font-size: 16px; }
        textarea {
            width: 100%; height: 90px; padding: 12px; border: 2px solid #ced4da;
            border-radius: 6px; font-size: 16px; resize: vertical; box-sizing: border-box; font-family: inherit;
        }
        textarea:focus { border-color: #001f3f; outline: none; }
        .hint { font-size: 13px; color: #6c757d; margin-top: 8px; display: flex; justify-content: space-between; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 15px; }
        .btn-search {
            flex: 2; padding: 14px; background-color: #001f3f; color: white;
            border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-search:hover { background-color: #001124; }
        .btn-search:disabled { background-color: #a0aec0; cursor: not-allowed; }

        /* 🔒 隱藏按鈕預設隱藏 (display: none) */
        .btn-ig-gen {
            display: none; 
            flex: 1; padding: 14px; background-color: #e1306c; color: white;
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;
            align-items: center; justify-content: center; gap: 6px;
        }
        .btn-ig-gen:hover { background-color: #c12056; }

        /* Grid 與卡片 */
        .results-count { margin-bottom: 15px; font-weight: bold; color: #2c3e50; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card {
            background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; overflow: hidden;
            display: flex; flex-direction: column; padding: 15px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
        .image-container { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .brand-badge { background: #eef2f7; color: #4a5568; font-size: 11px; padding: 4px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .product-name { font-size: 14px; font-weight: 600; color: #2d3748; margin: 0 0 12px 0; height: 40px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
        .price-wrapper { margin-top: auto; border-top: 1px dashed #edf2f7; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .price-label { font-size: 12px; color: #718096; }
        .price { font-size: 15px; color: #e53e3e; font-weight: bold; text-align: right; line-height: 1.3; }
        .no-result { text-align: center; color: #a0aec0; grid-column: 1 / -1; padding: 50px; font-size: 16px; }
        .click-tip { font-size: 11px; color: #3498db; text-align: right; margin-top: 2px; }

        /* Modal 彈出視窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-wrapper { position: relative; width: 90%; max-width: 550px; max-height: 85vh; display: flex; flex-direction: column; }
        .modal-content {
            background: #fff; width: 100%; height: 100%; border-radius: 12px; padding: 25px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s ease; box-sizing: border-box;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .close-btn {
            position: absolute; top: 15px; right: 15px; font-size: 30px; color: #666; cursor: pointer; border: none; background: rgba(255, 255, 255, 0.85); font-weight: bold; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10000; transition: background 0.2s, color 0.2s;
        }
        .close-btn:hover { color: #000; background: #fff; }
        .modal-detail-img { width: 100%; height: auto; background: #fafafa; margin-bottom: 15px; border-radius: 6px; display: block; }
        .thumb-container { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 60px; height: 60px; object-fit: contain; border: 2px solid #e2e8f0; border-radius: 4px; cursor: pointer; background: #fff; transition: border 0.2s; }
        .thumb-img.active { border-color: #001f3f; }
        .modal-brand { font-size: 13px; color: #001f3f; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; margin-top: 5px; }
        .modal-title { font-size: 18px; font-weight: bold; color: #1a1a1a; margin: 0 0 15px 0; line-height: 1.4; }
        .modal-price-box { background: #fff5f5; padding: 12px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .modal-price-label { font-size: 14px; color: #c53030; font-weight: 600; }
        .modal-price { font-size: 20px; color: #e53e3e; font-weight: bold; text-align: right; line-height: 1.3; }

        /* 📸 隱藏繪圖渲染區 (1080x1080 IG 格式) */
        #renderCanvasHidden {
            position: absolute; left: -9999px; top: -9999px; width: 1080px; height: 1080px; background: #ffffff;
        }
        .ig-poster-1080 {
            width: 1080px; height: 1080px; background: #ffffff; position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; box-sizing: border-box;
        }
        .ig-grid-item { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; border: 1px solid #f0f0f0; box-sizing: border-box; }
        .ig-grid-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 1. 產品名稱排版：純白底色 + 黑色字體 (完全移除陰影以防變灰色) */
        .ig-tag-title {
            position: absolute; top: 20px; left: 20px; right: 20px;
            background-color: #ffffff !important; color: #000000 !important;
            padding: 8px 12px; border-radius: 6px;
            font-size: 24px; font-weight: bold; line-height: 1.25;
            box-shadow: none !important; border: none !important;
            word-wrap: break-word; word-break: break-word;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        /* 2. 價錢：正下方中間 + 純白底色 + 黑色大字體 (完全移除陰影) */
        .ig-tag-price {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background-color: #ffffff !important; color: #000000 !important;
            padding: 6px 20px; border-radius: 8px;
            font-size: 38px; font-weight: 900;
            box-shadow: none !important; border: none !important;
            text-align: center; white-space: nowrap; line-height: 1.2;
        }

        /* 3. 中間品牌名：單一粉紅色背景 */
        .ig-center-brand {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: #f19da9 !important; color: #ffffff !important;
            font-size: 36px; font-weight: 900;
            padding: 12px 36px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 2px; z-index: 10;
            box-shadow: none !important; border: none !important;
        }
    .category-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.category-filters button{border:1px solid #ccd4df;background:#fff;border-radius:20px;padding:9px 16px;cursor:pointer}.category-filters button.active{background:#001f3f;color:white}.modal-brand{font-size:22px}.modal-title{font-size:18px}.brand-badge{font-size:16px}.product-name{font-size:14px}.price-meta{font-size:11px;color:#718096;margin-top:8px}</style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="logo.png" id="logoImg" alt="Company Logo" class="company-logo" onerror="this.style.display='none'">
        <h1>韓國 Olive Young 代購</h1>
        <div class="subtitle">每次最多可同時查詢 10 個品牌</div>
        <p class="notice-text">*價格可能因促銷優惠而變動，請於落單前與店主確認。</p>
    </div>
    
    <div id="statusMessage" class="status-message status-loading">⏳ 正在連線讀取免稅店產品資料庫，請稍候...</div>

    <div class="search-box">
        <label for="searchInput">請輸入查詢關鍵字（多個請用「空格」或「換行」隔開）：</label>
        <textarea id="searchInput" placeholder="例如輸入: 2AN AMUSE"></textarea>
        <div class="hint">
            <span id="brandCountHint">已輸入: 0 個關鍵字 / 上限 10 個</span>
            <span>支援同時查詢最多 10 個品牌</span>
        </div>
        <div class="btn-group">
            <button class="btn-search" id="searchBtn" onclick="performSearch()" disabled>請稍候...</button>
            <!-- 隱藏的按鈕 -->
            <button class="btn-ig-gen" id="igGenBtn" onclick="generateAllIGPosters()">📸 一鍵生成 IG 宣傳圖</button>
        </div>
    </div>

    <div id="categoryFilters" class="category-filters"></div>
<div class="results-count" id="resultsCount"></div>
    <div class="grid" id="resultsGrid"></div>
</div>

<!-- Modal 彈出視窗 -->
<div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal-wrapper" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal(event, true)">&times;</button>
        <div class="modal-content">
            <img src="" id="modalImg" class="modal-detail-img" alt="Product Detail" onerror="this.src='https://placehold.co/400x400?text=No+Detail+Image'">
            <div id="thumbContainer" class="thumb-container"></div>
            <div id="modalBrand" class="modal-brand">BRAND</div>
            <h2 id="modalTitle" class="modal-title">產品名稱項目</h2>
            <div class="modal-price-box">
                <span class="modal-price-label">價格以落單時確認為準</span>
                <span class="modal-price" id="modalPrice">HKD $0</span>
            </div>
        </div>
    </div>
</div>

<!-- 隱藏截圖畫布容器 -->
<div id="renderCanvasHidden">
    <div class="ig-poster-1080" id="igPostTemplate">
        <div class="ig-center-brand" id="igBrandTag">BRAND</div>
        <div class="ig-grid-item" id="igCell0"></div>
        <div class="ig-grid-item" id="igCell1"></div>
        <div class="ig-grid-item" id="igCell2"></div>
        <div class="ig-grid-item" id="igCell3"></div>
    </div>
</div>

<script>
let productsData=[], oliveYoungPrices={}, activeCategory='全部';
const CATEGORIES=['全部','Skincare','Cosmetics','Body Care','Haircare','Supplement','Others'];
const KRW_PER_HKD=155, MARKUP_MULTIPLIER=1.2;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function positive(v){const n=Number(v);return Number.isFinite(n)&&n>0?n:0;}
function goodsNo(item){try{return new URL(item['Olive Young URL']).searchParams.get('goodsNo')||'';}catch{return '';}}
function record(item){return oliveYoungPrices[goodsNo(item)]||{};}
function manual(item){return positive(item['Manual Price HKD']);}
function getShippingFee(item){return String(item['Shipping Type']||'').trim().toUpperCase()==='LARGE'?35:18;}
function calcDaigouPrice(item){if(manual(item))return Math.ceil(manual(item));const r=record(item);if(r.price_status&&r.price_status!=='OK')return 0;const krw=positive(r.kr_payment_price_krw);return krw?Math.ceil(krw/KRW_PER_HKD*MARKUP_MULTIPLIER+getShippingFee(item)):0;}
function priceText(item){const n=calcDaigouPrice(item);return n?'HK$'+n.toLocaleString('en-HK'):'價格待確認';}
function period(item){const r=record(item);return r.promotion_start&&r.promotion_end?r.promotion_start+' 至 '+r.promotion_end:'價格以落單時確認為準';}
function category(item){const v=String(item.Category||'').trim();return CATEGORIES.slice(1).find(c=>c.toLowerCase()===v.toLowerCase())||'Others';}
function parseKeywords(text){return text.trim().split(/[\n,，\s]+/).filter(Boolean);}
function status(text,error=false){const el=document.getElementById('statusMessage');el.style.display=text?'block':'none';el.className='status-message '+(error?'status-error':'status-loading');el.textContent=text;}
function drawFilters(){const el=document.getElementById('categoryFilters');el.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===activeCategory?'active':'';b.onclick=()=>{activeCategory=c;drawFilters();performSearch();};el.appendChild(b);});}
async function loadData(){
 try{
  if(!window.Papa)throw Error('CSV 讀取工具載入失敗，請檢查網絡後重新整理。');
  let rows=null;
  for(const name of ['pricelist.csv','Duty Free Pricelist.csv','Duty Free Pricelist.csv.csv']){
   const response=await fetch(encodeURI(name)+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)continue;
   const parsed=Papa.parse(await response.text(),{header:true,skipEmptyLines:'greedy',transformHeader:s=>s.replace(/^\uFEFF/,'').trim(),transform:s=>s.trim()});
   if(!parsed.meta.fields?.includes('Brand')||!parsed.meta.fields?.includes('Product Name'))continue;
   rows=parsed.data.filter(r=>r['Product Name']);break;
  }
  if(!rows)throw Error('找不到有效 pricelist.csv，請確認 Brand、Product Name 欄名。');
  productsData=rows;
  try{const response=await fetch('oliveyoung_prices.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();oliveYoungPrices=data.products||{};}catch{oliveYoungPrices={};}
  const missing=rows.filter(r=>!calcDaigouPrice(r)).length;
  status(missing?`已載入 ${rows.length} 件商品；其中 ${missing} 件未有有效售價。自動抓價尚需另外設定，手動價可照常使用。`:'',!!missing);
  document.getElementById('searchBtn').disabled=false;document.getElementById('searchBtn').textContent='立即查詢價格';drawFilters();performSearch();
 }catch(e){status(e.message,true);}
}
function performSearch(){let keys=parseKeywords(document.getElementById('searchInput').value);if(keys.length>10){alert('每次最多 10 個關鍵字，將使用前 10 個。');keys=keys.slice(0,10);}
 let filtered=productsData.filter(p=>(activeCategory==='全部'||category(p)===activeCategory)&&(!keys.length||keys.some(k=>((p.Brand||'')+' '+(p['Product Name']||'')).toLowerCase().includes(k.toLowerCase()))));
 let heading='商品';if(!keys.length&&activeCategory==='全部'){const featured=filtered.filter(p=>['TRUE','YES','1'].includes(String(p.Featured||'').toUpperCase()));if(featured.length){filtered=featured;heading='精選商品';}}
 document.getElementById('resultsCount').textContent=`${heading}：${filtered.length} 件`;
 const grid=document.getElementById('resultsGrid');grid.innerHTML='';
 if(!filtered.length){grid.innerHTML='<div class="no-result">沒有找到相符的商品。</div>';return;}
 filtered.forEach(item=>{const card=document.createElement('div');card.className='card';card.onclick=()=>openModal(item);card.innerHTML=`<div class="image-container"><img src="${esc(item.Image||'')}" alt="${esc(item['Product Name'])}" onerror="this.onerror=null;this.src='https://placehold.co/200x200?text=No+Image'"></div><div class="brand-badge">${esc(item.Brand||'Unknown')}</div><div class="product-name" title="${esc(item['Product Name'])}">${esc(item['Product Name'])}</div><div class="price-wrapper"><span class="price-label">${esc(period(item))}</span><span class="price">${priceText(item)}</span></div><div class="click-tip">🔍 點擊看細節</div>`;grid.appendChild(card);});
}
function openModal(item){const main=document.getElementById('modalImg'), thumbs=document.getElementById('thumbContainer');thumbs.innerHTML='';const imgs=String(item['Detail Image']||item.Image||'').split(/[;,]/).map(s=>s.trim()).filter(Boolean);main.src=imgs[0]||'https://placehold.co/400x400?text=No+Detail+Image';thumbs.style.display=imgs.length>1?'flex':'none';imgs.forEach((url,i)=>{const thumb=document.createElement('img');thumb.src=url;thumb.className='thumb-img'+(i===0?' active':'');thumb.onclick=()=>{main.src=url;thumbs.querySelectorAll('img').forEach(t=>t.classList.remove('active'));thumb.classList.add('active');};thumbs.appendChild(thumb);});document.getElementById('modalBrand').textContent=item.Brand||'Unknown';document.getElementById('modalTitle').textContent=item['Product Name']||'';document.querySelector('.modal-price-label').textContent=period(item);document.getElementById('modalPrice').textContent=priceText(item);document.getElementById('detailModal').classList.add('active');document.querySelector('.modal-content').scrollTop=0;}
function closeModal(event,force=false){if(force||event.target.id==='detailModal')document.getElementById('detailModal').classList.remove('active');}
document.addEventListener('keydown',event=>{if(event.ctrlKey&&event.shiftKey&&event.key.toLowerCase()==='g'){event.preventDefault();document.getElementById('igGenBtn').style.display='flex';alert('IG 圖片按鈕已顯示。此快捷鍵不是安全登入功能。');}});
document.getElementById('searchInput').addEventListener('input',function(){const n=parseKeywords(this.value).length;document.getElementById('brandCountHint').textContent=`已輸入: ${n} 個關鍵字 / 上限 10 個`;document.getElementById('brandCountHint').style.color=n>10?'#e53e3e':'#6c757d';});
document.addEventListener('DOMContentLoaded',loadData);
async function generateAllIGPosters() {
    if (productsData.length === 0) { alert("資料庫未載入完成，請稍候再試。"); return; }
    
    const brandMap = {};
    productsData.forEach(p => {
        const b = p["Brand"] ? p["Brand"].trim() : "";
        if (b) {
            if (!brandMap[b]) brandMap[b] = [];
            brandMap[b].push(p);
        }
    });

    const totalBrands = Object.keys(brandMap).length;
    if (!confirm(`系統將會自動為 ${totalBrands} 個品牌獨立產生 1:1 IG 宣傳圖，是否繼續？`)) return;

    for (const [brandName, items] of Object.entries(brandMap)) {
        for (let i = 0; i < items.length; i += 4) {
            const chunk = items.slice(i, i + 4);
            const pageNum = Math.floor(i / 4) + 1;
            
            document.getElementById("igBrandTag").innerText = brandName;
            for (let c = 0; c < 4; c++) {
                const cell = document.getElementById("igCell" + c);
                cell.innerHTML = "";
                if (chunk[c]) {
                    const item = chunk[c];
                    let rawPrice = priceText(item);
                    let titleStr = item['Product Name'] || '';
                    
                    let formattedPrice = String(rawPrice).trim();
                    if (!formattedPrice.includes('$') && !isNaN(parseFloat(formattedPrice))) {
                        formattedPrice = '$' + formattedPrice;
                    }

                    let fontSize = '24px';
                    if (titleStr.length > 60) {
                        fontSize = '18px';
                    } else if (titleStr.length > 40) {
                        fontSize = '20px';
                    }

                    cell.innerHTML = `
                        <img src="${esc(item['Image'] || '')}" crossorigin="anonymous" onerror="this.src='https://placehold.co/500x500?text=No+Image'">
                        <div class="ig-tag-title" style="font-size: ${fontSize};">${esc(titleStr)}</div>
                        <div class="ig-tag-price">${formattedPrice}</div>
                    `;
                }
            }

            await Promise.all(Array.from(document.querySelectorAll('#igPostTemplate img')).map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.onload = resolve; img.onerror = resolve; setTimeout(resolve, 8000); })));

            const targetElement = document.getElementById("igPostTemplate");
            const canvas = await html2canvas(targetElement, { 
                useCORS: true, 
                scale: 1,
                backgroundColor: "#ffffff"
            });
            
            const link = document.createElement("a");
            const cleanBrand = brandName.replace(/[^a-zA-Z0-9]/g, "_");
            link.download = `${cleanBrand}_Part${pageNum}_IG.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    }
    alert("🎉 所有品牌的 IG 宣傳圖已成功生成並下載！");
}

</script>

</body>
</html>
